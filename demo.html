<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EVMods — Tesla Visual Configurator</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.175.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.175.0/examples/jsm/"
    }
  }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --surface2: #181818;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.18);
      --text: #ffffff;
      --text-dim: rgba(255,255,255,0.45);
      --text-faint: rgba(255,255,255,0.2);
      --accent: #ffffff;
      --green: #34d399;
      --blue: #60a5fa;
      --panel-w: 270px;
      --summary-w: 230px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }

    /* ── LAYOUT ── */
    #app { display: flex; height: 100vh; }

    /* ── LEFT PANEL ── */
    #left-panel {
      width: var(--panel-w);
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--surface);
      z-index: 10;
    }

    #panel-header {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px; height: 28px;
      background: white;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .logo-text { font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .logo-sub { font-size: 10px; color: var(--text-dim); margin-top: 1px; }

    /* Category tabs */
    #cat-tabs {
      display: flex;
      gap: 4px;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .cat-tab {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid transparent;
      color: var(--text-dim);
      transition: all 0.15s;
      background: none;
      white-space: nowrap;
    }

    .cat-tab:hover { color: var(--text); border-color: var(--border); }
    .cat-tab.active { background: var(--text); color: #000; border-color: var(--text); }
    .cat-tab.has-mod::after { content: '•'; margin-left: 4px; color: var(--green); font-size: 9px; }
    .cat-tab.active.has-mod::after { color: #16a34a; }

    /* Mod list */
    #mod-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    #mod-list::-webkit-scrollbar { width: 4px; }
    #mod-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .mod-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      margin-bottom: 6px;
      cursor: pointer;
      transition: all 0.15s;
      position: relative;
    }

    .mod-item:hover { border-color: var(--border-hover); background: rgba(255,255,255,0.02); }
    .mod-item.selected { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.04); }

    .mod-item-top { display: flex; align-items: flex-start; gap: 10px; }

    .mod-swatch {
      width: 36px; height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      color: var(--text-faint);
    }

    .mod-info { flex: 1; min-width: 0; }
    .mod-brand { font-size: 10px; color: var(--text-dim); margin-bottom: 1px; }
    .mod-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mod-meta { display: flex; align-items: center; justify-content: space-between; margin-top: 4px; }
    .mod-price { font-size: 12px; font-weight: 700; color: var(--text); }
    .mod-diff { font-size: 10px; }
    .diff-1, .diff-2 { color: #34d399; }
    .diff-3 { color: #fbbf24; }
    .diff-4, .diff-5 { color: #f87171; }

    .mod-check {
      position: absolute;
      top: 8px; right: 8px;
      width: 18px; height: 18px;
      background: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px;
      color: black;
      font-weight: bold;
    }

    .mod-buy-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 6px;
      background: white;
      color: black;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .mod-buy-btn:hover { opacity: 0.85; }

    /* Color swatches for wrap */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      padding: 4px 0;
    }

    .color-swatch {
      aspect-ratio: 1;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.15s;
      position: relative;
    }

    .color-swatch:hover { transform: scale(1.08); }
    .color-swatch.selected { border-color: white; box-shadow: 0 0 0 1px rgba(255,255,255,0.3); }
    .color-swatch-label {
      font-size: 9px;
      color: var(--text-faint);
      text-align: center;
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tint options */
    .option-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text-dim);
      background: none;
      text-align: left;
      transition: all 0.15s;
      width: 100%;
    }

    .option-btn:hover { color: var(--text); border-color: var(--border-hover); }
    .option-btn.selected { color: black; background: white; border-color: white; }

    .option-price { font-size: 11px; font-weight: 600; }

    /* ── CANVAS AREA ── */
    #canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    canvas { display: block; width: 100% !important; height: 100% !important; }

    #canvas-hints {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.5px;
      pointer-events: none;
      white-space: nowrap;
    }

    #vehicle-label {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 11px;
      font-weight: 500;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
    }

    /* Vehicle selector top-center */
    #vehicle-tabs {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 4px 6px;
    }

    .v-tab {
      padding: 5px 14px;
      border-radius: 18px;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      color: var(--text-dim);
      border: none;
      background: none;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .v-tab:hover { color: var(--text); }
    .v-tab.active { background: white; color: black; }

    /* ── RIGHT PANEL ── */
    #right-panel {
      width: var(--summary-w);
      flex-shrink: 0;
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    #summary-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }

    #build-name-input {
      width: 100%;
      background: none;
      border: none;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      outline: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.15s;
    }

    #build-name-input:focus { border-color: var(--border-hover); }
    #build-name-input::placeholder { color: var(--text-faint); font-weight: 400; }

    .summary-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

    #summary-mods {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px;
    }

    #summary-mods::-webkit-scrollbar { width: 3px; }
    #summary-mods::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

    .summary-section-label {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }

    .summary-mod-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }

    .summary-mod-row:last-child { border-bottom: none; }
    .summary-mod-name { font-size: 11px; color: var(--text-dim); flex: 1; min-width: 0; }
    .summary-mod-price { font-size: 11px; font-weight: 700; color: var(--text); flex-shrink: 0; }

    .empty-state { text-align: center; padding: 24px 0; font-size: 11px; color: var(--text-faint); line-height: 1.6; }

    #summary-footer {
      padding: 14px 16px;
      border-top: 1px solid var(--border);
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .total-label { font-size: 12px; color: var(--text-dim); }
    .total-price { font-size: 22px; font-weight: 700; }

    .action-btn {
      display: block;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
      text-align: center;
      margin-bottom: 6px;
    }

    .action-btn-primary { background: white; color: black; }
    .action-btn-primary:hover { opacity: 0.88; }
    .action-btn-secondary { background: rgba(255,255,255,0.06); color: var(--text-dim); border: 1px solid var(--border); }
    .action-btn-secondary:hover { border-color: var(--border-hover); color: var(--text); }

    #share-url {
      display: none;
      margin-top: 8px;
      padding: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 10px;
      color: var(--text-dim);
      word-break: break-all;
      text-align: center;
    }

    /* Section heading in mod list */
    .mod-section-title {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 8px 2px 4px;
    }

    /* Scrollbar */
    * { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent; }

    /* Loading overlay */
    #loading {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      flex-direction: column;
      gap: 14px;
    }

    .spinner {
      width: 32px; height: 32px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--text-dim); }
  </style>
</head>
<body>

<div id="loading">
  <div class="logo-icon">⚡</div>
  <div class="spinner"></div>
  <div class="loading-text">Loading 3D Configurator…</div>
</div>

<div id="app" style="display:none;">

  <!-- ── LEFT PANEL ── -->
  <div id="left-panel">
    <div id="panel-header">
      <div class="logo-icon">⚡</div>
      <div>
        <div class="logo-text">EVMods</div>
        <div class="logo-sub">Tesla Configurator Demo</div>
      </div>
    </div>

    <div id="cat-tabs">
      <button class="cat-tab active" data-cat="wrap">Wrap</button>
      <button class="cat-tab" data-cat="wheels">Wheels</button>
      <button class="cat-tab" data-cat="tint">Tint</button>
      <button class="cat-tab" data-cat="spoilers">Spoiler</button>
      <button class="cat-tab" data-cat="lowering">Stance</button>
      <button class="cat-tab" data-cat="bodykit">Body Kit</button>
    </div>

    <div id="mod-list"></div>
  </div>

  <!-- ── CANVAS ── -->
  <div id="canvas-wrap">
    <canvas id="three-canvas"></canvas>

    <div id="vehicle-tabs">
      <button class="v-tab active" data-slug="model3-highland">Model 3 Highland</button>
      <button class="v-tab" data-slug="model3-legacy">Model 3 Legacy</button>
      <button class="v-tab" data-slug="model-y">Model Y</button>
    </div>

    <div id="vehicle-label">TESLA · 2024</div>
    <div id="canvas-hints">drag to rotate · scroll to zoom</div>
  </div>

  <!-- ── RIGHT PANEL ── -->
  <div id="right-panel">
    <div id="summary-header">
      <input type="text" id="build-name-input" placeholder="Name your build…" value="Stealth Model 3" />
      <div class="summary-sub" id="vehicle-sub">Tesla Model 3 Highland 2024</div>
    </div>

    <div id="summary-mods">
      <div class="summary-section-label">Selected Mods</div>
      <div id="mod-rows">
        <div class="empty-state">No mods selected yet.<br/>Pick from the left panel.</div>
      </div>
    </div>

    <div id="summary-footer">
      <div class="total-row">
        <span class="total-label">Total Mods</span>
        <span class="total-price" id="total-price">£0</span>
      </div>
      <button class="action-btn action-btn-primary" id="save-btn">Share Build Link</button>
      <button class="action-btn action-btn-secondary" id="reset-btn">Reset</button>
      <div id="share-url"></div>
    </div>
  </div>

</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── STATE ──────────────────────────────────────────────────────────────────
const state = {
  vehicle: 'model3-highland',
  selectedMods: {}, // category -> mod object
  carConfig: {
    bodyColor: '#0a0a0a',
    metalness: 0.3,
    roughness: 0.5,
    wrapType: 'gloss',
    wheelType: 'stock',
    wheelColor: '#2a2a2a',
    windowTint: 0.08,
    hasSpoiler: false,
    spoilerType: 'none',
    isLowered: false,

    hasMudflaps: false,

// ── DATA ──────────────────────────────────────────────────────────────────
const WRAP_COLORS = [
  { key:'midnight_black',  label:'Midnight Black',    hex:'#0a0a0a', metalness:0.3,  roughness:0.5,  type:'gloss',    price:2800 },
  { key:'satin_black',     label:'Satin Black',       hex:'#1a1a1a', metalness:0.05, roughness:0.85, type:'satin',    price:2900 },

  { key:'deep_blue',       label:'Deep Blue',         hex:'#1a3a5c', metalness:0.7,  roughness:0.3,  type:'metallic', price:3100 },
  { key:'racing_red',      label:'Racing Red',        hex:'#cc1a1a', metalness:0.3,  roughness:0.4,  type:'gloss',    price:2700 },
  { key:'stealth_grey',    label:'Stealth Grey',      hex:'#4a4a4a', metalness:0.05, roughness:0.85, type:'satin',    price:3000 },
  { key:'midnight_purple', label:'Midnight Purple',   hex:'#2a0a4a', metalness:0.4,  roughness:0.4,  type:'metallic', price:3400 },
  { key:'satin_gold',      label:'Satin Gold',        hex:'#b8860b', metalness:0.5,  roughness:0.75, type:'satin',    price:3200 },
  { key:'matte_green',     label:'Army Green',        hex:'#2d4a1e', metalness:0.0,  roughness:0.95, type:'matte',    price:2950 },
  { key:'chrome_silver',   label:'Chrome Silver',     hex:'#d0d0d0', metalness:0.95, roughness:0.05, type:'chrome',   price:4200 },

const CATEGORIES = {
  wrap: {

    mods: WRAP_COLORS.map(c => ({
      id: c.key, name: `${c.label} Full Wrap`, brand: '3M / Avery',

    }))
  },
  wheels: {
    label: 'Wheels',
    mods: [
      { id:'stock_18',   name:'OEM 18" Photon',       brand:'Tesla',               price:0,    difficulty:2, time:'1h',    wheelType:'stock',   icon:'⬤', wheelColor:'#1a1a1a' },
      { id:'oem_19',     name:'OEM 19" Induction',    brand:'Tesla',               price:1200, difficulty:2, time:'1h',    wheelType:'oem19',   icon:'⬤', wheelColor:'#222222' },
      { id:'sport_20',   name:'Zero-G 20" Forged',    brand:'T Sportline',         price:1899, difficulty:3, time:'2-3h',  wheelType:'sport',   icon:'⬤', wheelColor:'#111111', affiliateUrl:'https://tsportline.com' },
      { id:'hre_19',     name:'HRE FF21 19"',         brand:'HRE Wheels',          price:2840, difficulty:3, time:'2-3h',  wheelType:'hre',     icon:'⬤', wheelColor:'#0a0a0a', affiliateUrl:'https://hrewheels.com' },
      { id:'forged_21',  name:'VM Forged 21"',        brand:'T Sportline',         price:3499, difficulty:3, time:'2-4h',  wheelType:'forged',  icon:'⬤', wheelColor:'#050505', affiliateUrl:'https://tsportline.com' },
      { id:'aero_cover', name:'Aero Cover 20"',       brand:'Evannex',             price:289,  difficulty:1, time:'15min', wheelType:'aero',    icon:'⬤', wheelColor:'#181818' },
    ]
  },
  tint: {
    label: 'Window Tint',
    mods: [
      { id:'clear',    name:'No Tint (Clear)',    brand:'-',       price:0,   difficulty:0, time:'-',   tint:0.08,  icon:'◫' },
      { id:'tint_35',  name:'35% Light Tint',     brand:'LLumar', price:380, difficulty:4, time:'3h',  tint:0.42,  icon:'◫' },

      { id:'tint_5',   name:'5% Limo Tint',       brand:'XPEL',   price:490, difficulty:4, time:'3-4h',tint:0.80,  icon:'◫' },
    ]
  },
  spoilers: {
    label: 'Spoilers',
    mods: [
      { id:'none',      name:'No Spoiler',          brand:'-',                price:0,   difficulty:0, time:'-',     spoilerType:'none',     icon:'◬' },
      { id:'lip',       name:'Carbon Lip Spoiler',  brand:'T Sportline',      price:489, difficulty:2, time:'30min', spoilerType:'lip',      icon:'◬', affiliateUrl:'https://tsportline.com' },

      { id:'wing',      name:'Carbon GT Wing',      brand:'MCarbon',          price:895, difficulty:3, time:'2-3h',  spoilerType:'wing',     icon:'◬' },

  },
  lowering: {
    label: 'Stance',
    mods: [
      { id:'stock_h',   name:'Stock Height',           brand:'-',                   price:0,    difficulty:0, time:'-',     lowerAmount:0,  icon:'↕' },
      { id:'springs25', name:'Stage 1 Springs -25mm',  brand:'Unplugged Perf.',     price:349,  difficulty:4, time:'3-4h',  lowerAmount:25, icon:'↕', affiliateUrl:'https://unppluggedperformance.com' },
      { id:'coilover',  name:'BC Racing Coilovers',    brand:'BC Racing',           price:1299, difficulty:5, time:'4-6h',  lowerAmount:40, icon:'↕' },
      { id:'airride',   name:'Air Lift 3P Air Ride',   brand:'Air Lift',            price:3200, difficulty:5, time:'8-12h', lowerAmount:65, icon:'↕' },
    ]
  },
  bodykit: {
    label: 'Body Kit',
    mods: [
      { id:'none_bk',     name:'Stock Body',           brand:'-',               price:0,    difficulty:0, time:'-',     hasBodyKit:false, icon:'▬' },
      { id:'splitter',    name:'Carbon Front Splitter',brand:'T Sportline',     price:429,  difficulty:3, time:'1-2h',  hasBodyKit:true,  icon:'▬', affiliateUrl:'https://tsportline.com' },
      { id:'full_aero',   name:'Ascension Aero Kit',   brand:'Unplugged Perf.', price:2890, difficulty:4, time:'4-6h',  hasBodyKit:true,  icon:'▬' },
    ]
  }
};

const VEHICLE_LABELS = {
  'model3-highland': 'TESLA · MODEL 3 HIGHLAND · 2024',
  'model3-legacy':   'TESLA · MODEL 3 LEGACY · 2022',
  'model-y':         'TESLA · MODEL Y · 2024',
};

const VEHICLE_SUB = {
  'model3-highland': 'Tesla Model 3 Highland 2024',
  'model3-legacy':   'Tesla Model 3 Long Range AWD 2022',
  'model-y':         'Tesla Model Y Performance 2024',
};

// ── THREE.JS SETUP ─────────────────────────────────────────────────────────
const canvas = document.getElementById('three-canvas');
const wrap   = document.getElementById('canvas-wrap');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d0d12');
scene.fog = new THREE.Fog('#0d0d12', 12, 28);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
camera.position.set(5.5, 2.5, 5.5);

const controls = new OrbitControls(camera, canvas);
controls.enablePan = false;
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.5;
controls.minDistance = 3.5;
controls.maxDistance = 11;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minPolarAngle = 0.05;
controls.target.set(0, 0.2, 0);

// Lighting
const ambient = new THREE.AmbientLight('#ffffff', 0.35);
scene.add(ambient);

const sun = new THREE.DirectionalLight('#ffffff', 1.3);
sun.position.set(6, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 0.1;
sun.shadow.camera.far = 30;
sun.shadow.camera.left = -6;
sun.shadow.camera.right = 6;
sun.shadow.camera.top = 4;
sun.shadow.camera.bottom = -4;
sun.shadow.bias = -0.001;
scene.add(sun);

const fill = new THREE.DirectionalLight('#4466cc', 0.5);
fill.position.set(-6, 4, -6);
scene.add(fill);

const rim = new THREE.DirectionalLight('#ffffff', 0.2);
rim.position.set(0, 2, -8);
scene.add(rim);

const hemi = new THREE.HemisphereLight('#223366', '#111111', 0.4);
scene.add(hemi);

// Floor
const floorGeo = new THREE.PlaneGeometry(40, 40);
const floorMat = new THREE.MeshStandardMaterial({
  color: '#0a0a0e',
  roughness: 0.8,
  metalness: 0.4,
  envMapIntensity: 0.5,
});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.86;
floor.receiveShadow = true;
scene.add(floor);

// Studio grid lines (subtle)
const gridHelper = new THREE.GridHelper(20, 20, '#1a1a2a', '#111118');
gridHelper.position.y = -0.859;
scene.add(gridHelper);

// ── CAR BUILD ─────────────────────────────────────────────────────────────
let carGroup = null;

function mkMesh(geo, mat, pos, rot, castShadow = true) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(...pos);
  if (rot) m.rotation.set(...rot);
  m.castShadow = castShadow;
  m.receiveShadow = true;
  return m;
}

function addBox(parent, size, pos, mat) {
  parent.add(mkMesh(new THREE.BoxGeometry(...size), mat, pos));
}

function addWheel(parent, pos, config) {
  const g = new THREE.Group();
  g.position.set(...pos);
  g.rotation.z = Math.PI / 2;

  const rimColor  = config.wheelColor;
  const spokeCount = config.wheelType === 'forged' ? 10 : config.wheelType === 'hre' ? 5 : 5;
  const rimR = config.wheelType === 'forged' ? 0.285 : config.wheelType === 'sport' || config.wheelType === 'hre' ? 0.268 : 0.252;

  const tireMat = new THREE.MeshStandardMaterial({ color:'#0e0e0e', roughness:0.9 });
  const rimMat  = new THREE.MeshPhysicalMaterial({ color: rimColor, metalness:0.92, roughness:0.08, clearcoat:0.5 });

  // Tire
  g.add(mkMesh(new THREE.CylinderGeometry(rimR + 0.048, rimR + 0.048, 0.2, 28), tireMat, [0,0,0]));
  // Rim ring
  g.add(mkMesh(new THREE.TorusGeometry(rimR, 0.024, 8, 28), rimMat, [0,0,0], [Math.PI/2,0,0]));
  // Hub
  g.add(mkMesh(new THREE.CylinderGeometry(0.065, 0.065, 0.22, 12), rimMat, [0,0,0]));
  // Center cap
  g.add(mkMesh(new THREE.CylinderGeometry(0.042, 0.042, 0.02, 8), new THREE.MeshStandardMaterial({color:'#ffffff',metalness:0.95,roughness:0.05}), [0,0.11,0]));

  // Spokes
  for (let i = 0; i < spokeCount; i++) {
    const angle = (i / spokeCount) * Math.PI * 2;
    const sx = Math.cos(angle) * rimR * 0.56;
    const sz = Math.sin(angle) * rimR * 0.56;
    const spoke = mkMesh(new THREE.BoxGeometry(rimR * 0.09, 0.185, rimR * 0.88), rimMat, [sx, 0, sz]);
    spoke.rotation.y = angle;
    g.add(spoke);
  }

  parent.add(g);
}

function buildCar() {
  if (carGroup) { scene.remove(carGroup); carGroup = null; }

  const cfg = state.carConfig;
  const isModelY = state.vehicle === 'model-y';
  const sw = isModelY ? 1.09 : 1.0;  // width scale
  const sh = isModelY ? 1.13 : 1.0;  // height scale

  const lowerY = -(cfg.lowerAmount / 1000) * 2.5;

  const bodyMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(cfg.bodyColor),
    metalness: cfg.metalness,
    roughness: cfg.roughness,
    clearcoat: cfg.wrapType === 'gloss' || cfg.wrapType === 'chrome' ? 1.0 : cfg.wrapType === 'satin' ? 0.15 : 0.0,
    clearcoatRoughness: cfg.wrapType === 'chrome' ? 0.02 : cfg.roughness * 0.45,
    envMapIntensity: 1.0,
  });

  const glassMat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color('#08121e'),
    transparent: true,
    opacity: 0.18 + cfg.windowTint * 0.7,
    roughness: 0.04,
    metalness: 0.0,
    side: THREE.DoubleSide,
  });

  const trimMat   = new THREE.MeshStandardMaterial({ color:'#141414', metalness:0.85, roughness:0.25 });
  const lightMat  = new THREE.MeshStandardMaterial({ color:'#cce8ff', emissive:'#88aaff', emissiveIntensity:0.5 });
  const tailMat   = new THREE.MeshStandardMaterial({ color:'#ff2020', emissive:'#ff4444', emissiveIntensity:0.6 });
  const roofGlass = new THREE.MeshPhysicalMaterial({ color:'#08121e', transparent:true, opacity:0.28+cfg.windowTint*0.35, roughness:0.04, side:THREE.DoubleSide });

  const g = new THREE.Group();
  g.position.y = lowerY;

  // ── Body ──
  addBox(g, [4.22, 0.28,  1.88*sw], [0,      -0.22,  0], bodyMat);  // sill
  addBox(g, [1.42, 0.52*sh, 1.84*sw], [-1.40,  0.05,  0], bodyMat);  // rear
  addBox(g, [1.62, 0.52*sh, 1.88*sw], [0.20,   0.05,  0], bodyMat);  // center
  addBox(g, [1.32, 0.34*sh, 1.82*sw], [1.55,  -0.04,  0], bodyMat);  // hood
  addBox(g, [0.14, 0.24,  1.72*sw], [2.16,  -0.18,  0], bodyMat);  // front bumper
  addBox(g, [0.14, 0.24,  1.72*sw], [-2.16, -0.18,  0], bodyMat);  // rear bumper

  // ── Cabin ──
  addBox(g, [0.56, 0.68*sh, 1.56*sw], [0.85,  0.58*sh, 0], bodyMat);  // A-pillar zone
  addBox(g, [1.62, 0.14,  1.54*sw], [-0.10, 0.72*sh, 0], bodyMat);  // roof
  addBox(g, [0.72, 0.48*sh, 1.56*sw], [-1.0,  0.52*sh, 0], bodyMat);  // C-pillar

  // ── Panoramic roof glass ──
  addBox(g, [1.38, 0.04, 1.3*sw], [-0.10, 0.76*sh, 0], roofGlass);

  // ── Window trim ──
  addBox(g, [2.22, 0.038, 0.02], [0.15, 0.68*sh,  0.956*sw], trimMat);
  addBox(g, [2.22, 0.038, 0.02], [0.15, 0.68*sh, -0.956*sw], trimMat);

  // ── Rocker panels ──
  addBox(g, [3.0, 0.07, 0.04], [0.2, -0.34,  0.962*sw], trimMat);
  addBox(g, [3.0, 0.07, 0.04], [0.2, -0.34, -0.962*sw], trimMat);

  // ── Lights ──
  addBox(g, [0.04, 0.062, 1.52*sw], [ 2.17, -0.05, 0], lightMat);
  addBox(g, [0.04, 0.062, 1.52*sw], [-2.17, -0.05, 0], tailMat);

  // ── Windows (planes) ──
  const wf = mkMesh(new THREE.PlaneGeometry(1.4*sw, 0.88), glassMat, [1.08, 0.44*sh, 0]);
  wf.rotation.set(0, 0, -0.54); g.add(wf);
  const wr = mkMesh(new THREE.PlaneGeometry(1.38*sw, 0.68), glassMat, [-1.42, 0.34*sh, 0]);
  wr.rotation.set(0, 0, 0.58); g.add(wr);

  // Side windows
  [[0.55, 0.52*sh,  0.95*sw], [-0.35, 0.52*sh,  0.95*sw]].forEach(p => {
    const w = mkMesh(new THREE.PlaneGeometry(0.88, 0.38), glassMat, p);
    w.rotation.y = Math.PI/2; g.add(w);
  });
  [[0.55, 0.52*sh, -0.95*sw], [-0.35, 0.52*sh, -0.95*sw]].forEach(p => {
    const w = mkMesh(new THREE.PlaneGeometry(0.88, 0.38), glassMat, p);
    w.rotation.y = -Math.PI/2; g.add(w);
  });

  // ── Wheels ──
  const wpos = [
    [ 1.45, -0.55,  0.93*sw],
    [ 1.45, -0.55, -0.93*sw],
    [-1.45, -0.55,  0.93*sw],
    [-1.45, -0.55, -0.93*sw],
  ];
  wpos.forEach(p => addWheel(g, p, cfg));

  // ── Spoiler ──
  if (cfg.hasSpoiler) {
    const cfMat = new THREE.MeshPhysicalMaterial({ color:'#0a0a0a', metalness:0.92, roughness:0.08, clearcoat:1 });
    if (cfg.spoilerType === 'lip') {
      addBox(g, [0.06, 0.09, 1.52*sw], [-1.88, 0.07, 0], cfMat);
    } else if (cfg.spoilerType === 'ducktail') {
      const dt = mkMesh(new THREE.BoxGeometry(0.13, 0.11, 1.56*sw), cfMat, [-1.88, 0.13, 0]);
      dt.rotation.x = 0.14; g.add(dt);
    } else if (cfg.spoilerType === 'wing') {
      addBox(g, [0.22, 0.052, 1.72*sw], [-1.80, 0.30, 0], cfMat);
      addBox(g, [0.22, 0.30,  0.04],    [-1.80, 0.12,  0.88*sw], cfMat);
      addBox(g, [0.22, 0.30,  0.04],    [-1.80, 0.12, -0.88*sw], cfMat);
      addBox(g, [0.04, 0.32,  0.04],    [-1.80, 0.14,  0.62*sw], bodyMat);
      addBox(g, [0.04, 0.32,  0.04],    [-1.80, 0.14, -0.62*sw], bodyMat);
    }
  }

  // ── Body kit ──
  if (cfg.hasBodyKit) {
    const cfMat = new THREE.MeshPhysicalMaterial({ color:'#0a0a0a', metalness:0.92, roughness:0.08, clearcoat:1 });
    addBox(g, [0.08, 0.06, 1.62*sw], [ 2.22, -0.35, 0], cfMat);   // front splitter
    addBox(g, [2.82, 0.1,  0.06],    [ 0.20, -0.39,  0.98*sw], cfMat); // skirt L
    addBox(g, [2.82, 0.1,  0.06],    [ 0.20, -0.39, -0.98*sw], cfMat); // skirt R
    addBox(g, [0.10, 0.13, 1.52*sw], [-2.22, -0.32, 0], cfMat);   // diffuser
  }

  carGroup = g;
  scene.add(g);
}

// ── RESIZE ────────────────────────────────────────────────────────────────
function resize() {
  const w = wrap.clientWidth  || window.innerWidth  - 500;
  const h = wrap.clientHeight || window.innerHeight;
  if (w < 1 || h < 1) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

window.addEventListener('resize', resize);

// ── RENDER LOOP ───────────────────────────────────────────────────────────
let tick = 0;
function animate() {
  requestAnimationFrame(animate);
  controls.update();

  if (carGroup) {
    carGroup.position.y = state.carConfig.lowerAmount > 0
      ? -(state.carConfig.lowerAmount / 1000) * 2.5 + Math.sin(tick * 0.008) * 0.012
      : Math.sin(tick * 0.008) * 0.012;
  }
  tick++;

  // Skip render if canvas has no size yet (hidden during load)
  if (renderer.domElement.width > 0 && renderer.domElement.height > 0) {
    renderer.render(scene, camera);
  }
}

animate();

// ── UI ─────────────────────────────────────────────────────────────────────
function formatPrice(p) {
  if (p === 0) return 'Included';
  return '£' + p.toLocaleString('en-GB');
}

function getDiffClass(d) {
  return d <= 2 ? 'diff-1' : d === 3 ? 'diff-3' : 'diff-5';
}

function getDiffLabel(d) {
  return ['','Beginner','Easy','Intermediate','Advanced','Pro'][d] || '';
}

let currentCat = 'wrap';

function renderModList() {
  const list = document.getElementById('mod-list');
  list.innerHTML = '';
  const cat = CATEGORIES[currentCat];
  if (!cat) return;

  if (currentCat === 'wrap') {
    // Color grid
    const title = document.createElement('div');
    title.className = 'mod-section-title';
    title.style.padding = '10px 12px 2px';
    title.textContent = 'Wrap Colour';
    list.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'color-grid';
    grid.style.padding = '6px 12px 10px';

    WRAP_COLORS.forEach(c => {
      const col = document.createElement('div');
      const sel = state.selectedMods['wrap']?.id === c.key;
      col.innerHTML = `
        <div class="color-swatch${sel ? ' selected' : ''}" style="background:${c.hex}" title="${c.label}" data-key="${c.key}"></div>
        <div class="color-swatch-label">${c.label.split(' ')[0]}</div>
      `;
      col.querySelector('.color-swatch').addEventListener('click', () => {
        const mod = cat.mods.find(m => m.id === c.key);
        selectMod('wrap', mod);
      });
      grid.appendChild(col);
    });
    list.appendChild(grid);

    // Price row for selected wrap
    if (state.selectedMods['wrap']) {
      const m = state.selectedMods['wrap'];
      const priceDiv = document.createElement('div');
      priceDiv.style.cssText = 'padding:0 12px 10px;font-size:11px;color:rgba(255,255,255,0.4)';
      priceDiv.innerHTML = `<b style="color:white">${m.name}</b> — ${formatPrice(m.price)}`;
      list.appendChild(priceDiv);
    }

  } else {
    // Option buttons
    cat.mods.forEach(mod => {
      const sel = state.selectedMods[currentCat]?.id === mod.id;
      const item = document.createElement('div');
      item.className = 'mod-item' + (sel ? ' selected' : '');

      let iconHtml = '';
      if (currentCat === 'wheels') {
        iconHtml = `<div class="mod-swatch" style="background:${mod.wheelColor||'#1a1a1a'};font-size:8px;border-radius:50%;width:36px;height:36px;"></div>`;
      } else {
        iconHtml = `<div class="mod-swatch">${mod.icon}</div>`;
      }

      item.innerHTML = `
        ${sel ? '<div class="mod-check">✓</div>' : ''}
        <div class="mod-item-top">
          ${iconHtml}
          <div class="mod-info">
            <div class="mod-brand">${mod.brand}</div>
            <div class="mod-name">${mod.name}</div>
            <div class="mod-meta">
              <span class="mod-price">${formatPrice(mod.price)}</span>
              <span class="mod-diff ${getDiffClass(mod.difficulty)}">${getDiffLabel(mod.difficulty)}</span>
            </div>
          </div>
        </div>
        ${sel && mod.affiliateUrl ? `<a class="mod-buy-btn" href="${mod.affiliateUrl}" target="_blank">Buy Now ↗</a>` : ''}
      `;

      item.addEventListener('click', (e) => {
        if (e.target.classList.contains('mod-buy-btn')) return;
        const alreadySel = state.selectedMods[currentCat]?.id === mod.id;
        selectMod(currentCat, alreadySel ? null : mod);
      });

      list.appendChild(item);
    });
  }
}

function selectMod(cat, mod) {
  state.selectedMods[cat] = mod || null;
  applyModToConfig(cat, mod);
  buildCar();
  renderModList();
  renderSummary();
  updateCatTabs();
}

function applyModToConfig(cat, mod) {
  const cfg = state.carConfig;

  if (cat === 'wrap') {
    if (!mod) {
      cfg.bodyColor = '#0a0a0a'; cfg.metalness = 0.3; cfg.roughness = 0.5; cfg.wrapType = 'gloss';
    } else {
      const c = WRAP_COLORS.find(w => w.key === mod.id);
      if (c) { cfg.bodyColor = c.hex; cfg.metalness = c.metalness; cfg.roughness = c.roughness; cfg.wrapType = c.type; }
    }
  } else if (cat === 'wheels') {
    cfg.wheelType  = mod?.wheelType  || 'stock';
    cfg.wheelColor = mod?.wheelColor || '#2a2a2a';
  } else if (cat === 'tint') {
    cfg.windowTint = mod?.tint ?? 0.08;
  } else if (cat === 'spoilers') {
    cfg.hasSpoiler  = !!mod && mod.spoilerType !== 'none';
    cfg.spoilerType = mod?.spoilerType || 'none';
  } else if (cat === 'lowering') {
    cfg.lowerAmount = mod?.lowerAmount ?? 0;
    cfg.isLowered   = (mod?.lowerAmount ?? 0) > 0;
  } else if (cat === 'bodykit') {
    cfg.hasBodyKit = !!mod && mod.hasBodyKit;
  }
}

function renderSummary() {
  const rows = document.getElementById('mod-rows');
  const mods = Object.values(state.selectedMods).filter(Boolean).filter(m => m.price > 0);

  if (mods.length === 0) {
    rows.innerHTML = '<div class="empty-state">No mods selected yet.<br/>Pick from the left panel.</div>';
    document.getElementById('total-price').textContent = '£0';
    return;
  }

  rows.innerHTML = mods.map(m => `
    <div class="summary-mod-row">
      <div class="summary-mod-name">${m.name}</div>
      <div class="summary-mod-price">${formatPrice(m.price)}</div>
    </div>
  `).join('');

  const total = mods.reduce((s, m) => s + m.price, 0);
  document.getElementById('total-price').textContent = '£' + total.toLocaleString('en-GB');
}

function updateCatTabs() {
  document.querySelectorAll('.cat-tab').forEach(tab => {
    const cat = tab.dataset.cat;
    const hasMod = !!(state.selectedMods[cat] && (cat === 'wrap' || state.selectedMods[cat].price > 0));
    tab.classList.toggle('has-mod', hasMod);
    tab.classList.toggle('active', cat === currentCat);
  });
}

// Category tab clicks
document.querySelectorAll('.cat-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentCat = tab.dataset.cat;
    updateCatTabs();
    renderModList();
  });
});

// Vehicle tabs
document.querySelectorAll('.v-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.v-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    state.vehicle = tab.dataset.slug;
    document.getElementById('vehicle-label').textContent = VEHICLE_LABELS[state.vehicle];
    document.getElementById('vehicle-sub').textContent   = VEHICLE_SUB[state.vehicle];
    buildCar();
  });
});

// Save / share
document.getElementById('save-btn').addEventListener('click', () => {
  const mods = Object.entries(state.selectedMods)
    .filter(([, m]) => m)
    .map(([k, m]) => `${k}:${m.id}`)
    .join(',');
  const name = document.getElementById('build-name-input').value;
  const url = `${location.href}?v=${state.vehicle}&m=${encodeURIComponent(mods)}&n=${encodeURIComponent(name)}`;

  navigator.clipboard.writeText(url).catch(() => {});

  const el = document.getElementById('share-url');
  el.style.display = 'block';
  el.textContent = '✓ Link copied! Share this URL to show your build.';
  setTimeout(() => el.style.display = 'none', 4000);
});

// Reset
document.getElementById('reset-btn').addEventListener('click', () => {
  state.selectedMods = {};
  state.carConfig = {
    bodyColor:'#0a0a0a', metalness:0.3, roughness:0.5, wrapType:'gloss',
    wheelType:'stock', wheelColor:'#2a2a2a', windowTint:0.08,
    hasSpoiler:false, spoilerType:'none', isLowered:false, lowerAmount:0,
    hasBodyKit:false, hasMudflaps:false,
  };
  document.getElementById('build-name-input').value = 'My Tesla Build';
  buildCar();
  renderModList();
  renderSummary();
  updateCatTabs();
});

// Restore from URL params
function restoreFromURL() {
  const p = new URLSearchParams(location.search);
  if (p.get('v')) {
    state.vehicle = p.get('v');
    const tab = document.querySelector(`.v-tab[data-slug="${state.vehicle}"]`);
    if (tab) { document.querySelectorAll('.v-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); }
    document.getElementById('vehicle-label').textContent = VEHICLE_LABELS[state.vehicle] || '';
    document.getElementById('vehicle-sub').textContent   = VEHICLE_SUB[state.vehicle] || '';
  }
  if (p.get('n')) {
    document.getElementById('build-name-input').value = decodeURIComponent(p.get('n'));
  }
  if (p.get('m')) {
    const entries = decodeURIComponent(p.get('m')).split(',');
    entries.forEach(entry => {
      const [cat, modId] = entry.split(':');
      if (!cat || !modId || !CATEGORIES[cat]) return;
      const mod = CATEGORIES[cat].mods.find(m => m.id === modId);
      if (mod) { state.selectedMods[cat] = mod; applyModToConfig(cat, mod); }
    });
  }
}

// ── INIT ─────────────────────────────────────────────────────────────────
restoreFromURL();
buildCar();
renderModList();
renderSummary();
updateCatTabs();

// Show app — MUST resize after making container visible so canvas gets real dimensions
function showApp() {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  requestAnimationFrame(() => { resize(); renderer.render(scene, camera); });
}
setTimeout(showApp, 400);
</script>
